<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNS Check</title>
<script src="/theme-init.js"></script>
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb" crossorigin="anonymous">
<style>
  :root {
    color-scheme: light dark;
    --bg:#f5f6f8; --fg:#16181c; --mut:#667085; --card:#fff; --line:#e4e7ec;
    --onme:#fff; --ok:#12805c; --okbg:#e3f5ee; --bad:#c0262d; --badbg:#fdeaea; --warn:#a15c00; --warnbg:#fff3df; --me:#2563eb;
  }
  :root[data-theme="light"] { color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#0e0f12; --fg:#ececf0; --mut:#9aa1ad; --card:#17191d; --line:#2a2d33;
    --onme:#0e0f12; --ok:#4cc79a; --okbg:#10291f; --bad:#ff7b80; --badbg:#2d1517; --warn:#f0b45a; --warnbg:#2b2112; --me:#6ea0ff;
  } }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:#0e0f12; --fg:#ececf0; --mut:#9aa1ad; --card:#17191d; --line:#2a2d33;
    --onme:#0e0f12; --ok:#4cc79a; --okbg:#10291f; --bad:#ff7b80; --badbg:#2d1517; --warn:#f0b45a; --warnbg:#2b2112; --me:#6ea0ff;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,"Hiragino Sans","PingFang SC","Noto Sans CJK SC",sans-serif; }
  main { max-width:1000px; margin:0 auto; padding:24px 16px 40px; }
  header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px; }
  .hdr-right { display:flex; align-items:center; flex-wrap:wrap; justify-content:flex-end; gap:8px; }
  h1 { font-size:1.35rem; margin:0; }
  .brand { display:flex; align-items:center; gap:12px; } .logo { width:44px; height:44px; flex:none; }
  .expect { display:flex; align-items:center; flex-wrap:wrap; gap:8px 12px; margin:0 0 12px; color:var(--mut); font-size:.9rem; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chips button { font:inherit; font-size:.875rem; font-weight:500; padding:8px 14px; min-height:40px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  .chips button:hover { border-color:var(--mut); }
  .chips button[aria-pressed="true"] { background:var(--me); border-color:var(--me); color:var(--onme); font-weight:600; }
  .chips button:focus-visible { outline:3px solid var(--me); outline-offset:2px; }
  .stamp { color:var(--mut); font-size:.85rem; }
  h2 { font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); margin:0 0 10px; font-weight:600; }
  #rerun { font:inherit; font-weight:600; padding:10px 16px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; min-height:44px; }
  #rerun:hover { border-color:var(--mut); }
  #rerun:focus-visible { outline:3px solid var(--me); outline-offset:2px; }
  #rerun:disabled { opacity:.6; cursor:wait; }

  .hero { border-radius:16px; padding:20px; margin-bottom:16px; border:1px solid var(--line); background:var(--card); display:flex; gap:16px; align-items:center; }
  .hero .icon { width:52px; height:52px; border-radius:50%; display:grid; place-items:center; font-size:1.6rem; flex:none; }
  .hero .t { font-size:1.25rem; font-weight:700; line-height:1.25; }
  .hero .s { color:var(--mut); }
  .hero.ok { background:var(--okbg); border-color:transparent; } .hero.ok .icon { background:var(--ok); color:#fff; }
  .hero.bad { background:var(--badbg); border-color:transparent; } .hero.bad .icon { background:var(--bad); color:#fff; }
  .hero.warn { background:var(--warnbg); border-color:transparent; } .hero.warn .icon { background:var(--warn); color:#fff; }
  .hero.run .icon { background:var(--line); color:var(--mut); }

  .grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.3fr); gap:16px; }
  @media (max-width:760px) { .grid { grid-template-columns:1fr; } }
  .stack { display:grid; gap:16px; align-content:start; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 16px; margin:0; }
  .kv dt { color:var(--mut); } .kv dd { margin:0; text-align:right; overflow-wrap:anywhere; }
  ul.res { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
  ul.res li { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; align-items:start; padding:10px 12px; border-radius:10px; background:var(--bg); }
  ul.res .dot { width:10px; height:10px; border-radius:50%; margin-top:7px; }
  ul.res .org { font-weight:600; }
  ul.res .meta { grid-column:2; color:var(--mut); font-size:.875rem; overflow-wrap:anywhere; }
  .tag { font-size:.7rem; font-weight:700; padding:1px 7px; border-radius:99px; margin-left:6px; vertical-align:middle; }
  .tag.ok { background:var(--okbg); color:var(--ok); } .tag.bad { background:var(--badbg); color:var(--bad); }

  /* map: greyscale tiles (inverted in dark mode); only the pins carry colour. Leaflet re-measures via ResizeObserver. */
  .mapcard { padding:8px; display:flex; flex-direction:column; }
  #map { flex:1; min-height:420px; border-radius:12px; background:var(--bg); }
  .leaflet-container { background:var(--bg); font:inherit; }
  .leaflet-tile-pane { filter:grayscale(1) contrast(1.05); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .leaflet-tile-pane { filter:grayscale(1) invert(1) brightness(.82) contrast(.95); } }
  :root[data-theme="dark"] .leaflet-tile-pane { filter:grayscale(1) invert(1) brightness(.82) contrast(.95); }
  .leaflet-container a { color:var(--me); }
  .pin { width:16px; height:16px; border-radius:50%; border:3px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.45); }
  .legend { display:flex; gap:14px; flex-wrap:wrap; color:var(--mut); font-size:.85rem; padding:10px 8px 4px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; }

  details.log summary { cursor:pointer; font-weight:600; } details.log summary:focus-visible { outline:3px solid var(--me); outline-offset:2px; }
  .tbl { width:100%; border-collapse:collapse; margin-top:12px; font-size:.875rem; } .tbl th { text-align:left; color:var(--mut); font-weight:600; } .tbl th, .tbl td { padding:6px 8px 6px 0; border-bottom:1px solid var(--line); vertical-align:top; overflow-wrap:anywhere; }
  .tblwrap { overflow-x:auto; }
  pre.raw { margin:12px 0 0; padding:12px; background:var(--bg); border-radius:10px; font:12px/1.5 ui-monospace,Menlo,monospace; overflow-x:auto; white-space:pre-wrap; overflow-wrap:anywhere; color:var(--mut); }
  small.note { display:block; color:var(--mut); margin:20px 4px 0; font-size:.8rem; line-height:1.5; max-width:70ch; }
  small.note a { color:var(--me); }
  @media (prefers-reduced-motion: no-preference) { .hero.run .icon { animation:pulse 1.2s ease-in-out infinite; } @keyframes pulse { 50% { opacity:.45; } } }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#0ea5a4"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#lg)"/><g fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1"><circle cx="16" cy="16.5" r="12"/><circle cx="16" cy="16.5" r="8.5"/></g><path d="M16 5.5 7.5 8.6v6.6c0 5.2 3.5 8.7 8.5 10.9 5-2.2 8.5-5.7 8.5-10.9V8.6z" fill="#fff"/><path d="m11.9 15.8 3 3 5.4-5.9" fill="none" stroke="#0e8fa6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><div><h1>DNS Check</h1><div class="stamp" id="stamp"></div></div></div>
    <div class="hdr-right"><div data-dnsck-controls></div><button id="rerun" data-i18n="rerun">Run again</button></div>
  </header>

  <div class="expect" role="group" aria-labelledby="expectlbl"><span id="expectlbl" data-i18n="expecting">Expecting</span>
    <div class="chips" id="expect"><button type="button" data-v="auto" data-i18n="auto">Auto-detect</button><button type="button" data-v="controld">Control D</button><button type="button" data-v="cloudflare">Cloudflare (1.1.1.1)</button><button type="button" data-v="nextdns">NextDNS</button><button type="button" data-v="google">Google Public DNS</button><button type="button" data-v="quad9">Quad9</button><button type="button" data-v="opendns">OpenDNS (Cisco)</button><button type="button" data-v="adguard">AdGuard DNS</button></div></div>

  <section class="hero run" id="hero" aria-live="polite"></section>

  <div class="grid">
    <div class="stack">
      <section class="card"><h2 data-i18n="c_conn">Your connection</h2><dl class="kv" id="you"></dl></section>
      <section class="card"><h2 data-i18n="c_res">Resolvers that answered</h2><ul class="res" id="resolvers"></ul></section>
      <section class="card"><h2 data-i18n="c_checks">Provider checks and filtering</h2><ul class="res" id="checks"></ul></section>
    </div>
    <section class="card mapcard">
      <div id="map" role="img" data-i18n-attr="aria-label:map_label" aria-label="Map showing your location and the DNS resolvers that answered"></div>
      <div class="legend"><span><i style="background:var(--me)"></i><span data-i18n="you">You</span></span><span><i style="background:var(--ok)"></i><span data-i18n="exp_res">Expected resolver</span></span><span><i style="background:var(--bad)"></i><span data-i18n="oth_res">Other resolver</span></span></div>
    </section>
  </div>

  <section class="card" style="margin-top:16px"><details class="log"><summary data-i18n="log">Test log</summary>
    <div class="tblwrap"><table class="tbl"><thead><tr><th data-i18n="th_ip">IP</th><th data-i18n="th_prov">Provider</th><th data-i18n="th_country">Country</th><th data-i18n="th_result">Result</th></tr></thead><tbody id="logrows"></tbody></table></div>
    <pre class="raw" id="logtext" tabindex="0"></pre>
  </details></section>

  <small class="note"><span data-i18n="note" data-n="10"></span> <a href="/privacy" data-i18n="privacy">Privacy and terms</a> · <a href="https://github.com/Ol775/dns-check" rel="noopener" data-i18n="source">Source on GitHub</a></small>
</main>
<script src="/ui.js"></script>
<script src="/cookie-notice.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO" crossorigin="anonymous"></script>
<script src="/app.js"></script>
</body>
</html>
